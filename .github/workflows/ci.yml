name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -W error -m pytest -q
      - run: nepali-eval validate tasks/seed_v0.jsonl
      - run: nepali-eval lint tasks/seed_v0.jsonl --strict
      - run: nepali-eval run --tasks tasks/seed_v0.jsonl --adapter oracle --out out/oracle
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" bandit pip-audit
      - run: bandit -q -r src
      - run: pip-audit --local --skip-editable
